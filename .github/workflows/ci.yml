name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  firmware:
    name: Firmware motion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the real StepperController, HomingController, MotionPlanner and
      # SerialProtocol against the Arduino mock in firmware/test/mock, so what runs
      # here is what runs on the Teensy. No board or toolchain needed.
      - name: Build and run
        run: make -C firmware/test test

  app:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot-arm-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: robot-arm-control/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx react-scripts test --watchAll=false
        env:
          CI: true

      - name: Build
        run: npx react-scripts build
        env:
          CI: false # source-map warnings from a transitive dep are not failures
